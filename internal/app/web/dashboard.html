<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>longbridge 状态面板</title>
  <link rel="stylesheet" href="static/dashboard.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <span class="brand-name">longbridge</span>
        <span class="pill" id="mode-pill"></span>
      </div>
      <div class="top-meta" id="top-meta"></div>
    </header>

    <section class="kpis" id="kpis"></section>

    <section class="section">
      <div class="section-bar">
        <h2 class="section-title">标的</h2>
        <div class="segmented" id="stock-filter">
          <button type="button" class="segment active" data-filter="all">全部 <span id="count-all">0</span></button>
          <button type="button" class="segment" data-filter="pending">挂单 <span id="count-pending">0</span></button>
          <button type="button" class="segment" data-filter="limited">受限 <span id="count-limited">0</span></button>
          <button type="button" class="segment" data-filter="error">异常 <span id="count-error">0</span></button>
        </div>
      </div>
      <div class="stock-grid" id="stock-grid"></div>
      <div class="disabled-list" id="disabled-section"></div>
    </section>

    <details class="card fold" id="account-fold">
      <summary>账户资产明细</summary>
      <div id="account-section"></div>
    </details>

    <section id="event-section"></section>

    <footer class="foot" id="foot"></footer>
  </div>

  <script id="initial-status" type="application/json">{{toJSON .}}</script>
  <script src="static/dashboard.js" defer></script>
</body>
</html>
